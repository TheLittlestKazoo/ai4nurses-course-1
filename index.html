<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Vocabulary Memory Game</title>

<style>
body{
font-family: Arial, sans-serif;
background:#f4f6f8;
display:flex;
justify-content:center;
}

#container{
width:700px;
text-align:center;
padding:10px;
}

#controls{
margin:15px 0;
}

button{
padding:10px 16px;
margin:5px;
font-size:14px;
border:none;
border-radius:6px;
background:#2c7be5;
color:white;
cursor:pointer;
}

#game{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-top:20px;
}

.card{
height:120px;
background:#2c7be5;
color:white;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
cursor:pointer;
padding:12px;
font-size:15px;
text-align:center;
line-height:1.3;
}

.card.flipped{
background:white;
color:#333;
border:2px solid #2c7be5;
}

.card.matched{
background:#6cc070;
color:white;
cursor:default;
}

#status{
margin-top:15px;
font-size:16px;
}
</style>
</head>

<body>

<div id="container">

<h3>Match the AI Vocabulary</h3>
<p>Study the cards first, then find the pairs.</p>

<div id="controls">
<button onclick="shuffleGame()">Shuffle</button>
<button onclick="restartGame()">Replay</button>
</div>

<div id="game"></div>
<div id="status"></div>

</div>

<script>

const pairs = [
["Machine Learning","Systems that identify patterns in data and use those patterns to answer questions"],
["Labels","Known outcomes attached to past examples"],
["Generative AI","Produces new content such as summaries, drafts, or responses using patterns learned from large datasets"],
["Training","Exposing a model to large numbers of examples so it can begin identifying patterns in the dataset"],
["Learning","When a model adjusts its internal parameters to better reflect patterns in the examples it was trained on"]
];

let cards=[];
let first=null;
let second=null;
let lock=false;
let matches=0;

function buildCards(){
cards=[];
pairs.forEach(pair=>{
cards.push({text:pair[0],id:pair[0]});
cards.push({text:pair[1],id:pair[0]});
});
cards.sort(()=>Math.random()-0.5);
}

function renderBoard(){

const game=document.getElementById("game");
game.innerHTML="";

cards.forEach(cardData=>{
const card=document.createElement("div");
card.className="card";
card.dataset.id=cardData.id;
card.dataset.text=cardData.text;
card.innerText="?";
card.onclick=()=>handleFlip(card);
game.appendChild(card);
});

startPreview();
}

function startPreview(){

lock=true;
document.getElementById("status").innerText="Study the cards...";

const allCards=document.querySelectorAll(".card");

allCards.forEach(card=>{
card.classList.add("flipped");
card.innerText=card.dataset.text;
});

setTimeout(()=>{
allCards.forEach(card=>{
card.classList.remove("flipped");
card.innerText="?";
});
document.getElementById("status").innerText="Begin matching!";
lock=false;
},10000);

}

function handleFlip(card){

if(lock || card.classList.contains("matched") || card.classList.contains("flipped")) return;

card.classList.add("flipped");
card.innerText=card.dataset.text;

if(!first){
first=card;
return;
}

second=card;
lock=true;

if(first.dataset.id===second.dataset.id){

first.classList.add("matched");
second.classList.add("matched");

matches++;

resetTurn();

if(matches===pairs.length){
document.getElementById("status").innerText="Nice work! You matched all terms.";
}

}else{

setTimeout(()=>{
first.classList.remove("flipped");
second.classList.remove("flipped");
first.innerText="?";
second.innerText="?";
resetTurn();
},900);

}

}

function resetTurn(){
[first,second,lock]=[null,null,false];
}

function shuffleGame(){
buildCards();
renderBoard();
resetStats();
}

function restartGame(){
buildCards();
renderBoard();
resetStats();
}

function resetStats(){
matches=0;
first=null;
second=null;
lock=false;
document.getElementById("status").innerText="";
}

buildCards();
renderBoard();

</script>

</body>
</html>
