<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Vocabulary Matching</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f4f6f8;
display:flex;
justify-content:center;
}

#container{
width:700px;
text-align:center;
}

#game{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:25px;
}

.column{
display:flex;
flex-direction:column;
gap:12px;
}

.term{
background:#012169;
color:white;
padding:14px;
border-radius:8px;
cursor:grab;
font-weight:bold;
transition:transform .25s;
}

.definition{
background:#E89923;
color:white;
padding:14px;
border-radius:8px;
min-height:60px;
display:flex;
align-items:center;
transition:all .2s ease;
}

.definition.correct{
background:#6cc070;
}

.definition.hover{
outline:4px solid #FFD166;
transform:scale(1.02);
}

.shake{
animation:shake .35s;
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-6px)}
50%{transform:translateX(6px)}
75%{transform:translateX(-6px)}
100%{transform:translateX(0)}
}

button{
margin-top:15px;
padding:10px 16px;
border:none;
background:#012169;
color:white;
border-radius:6px;
cursor:pointer;
}

#status{
margin-top:20px;
font-weight:bold;
}

</style>
</head>

<body>

<div id="container">

<h3>Match the AI Vocabulary</h3>
<p>Drag each term onto its correct definition.</p>

<div id="game">

<div class="column" id="terms"></div>

<div class="column" id="definitions"></div>

</div>

<button onclick="startGame()">Shuffle</button>

<div id="status" aria-live="polite"></div>

</div>

<script>

const pairs = [

{
term:"Machine Learning",
definition:"Systems that identify patterns in data and use those patterns to answer questions"
},

{
term:"Labels",
definition:"Known outcomes attached to past examples"
},

{
term:"Generative AI",
definition:"Produces new content such as summaries, drafts, or responses using patterns learned from large datasets"
},

{
term:"Training",
definition:"Exposing a model to large numbers of examples so it can begin identifying patterns in the dataset"
},

{
term:"Learning",
definition:"When a model adjusts its internal parameters to better reflect patterns in the examples it was trained on"
}

];

let dragged=null;
let matches=0;

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

function startGame(){

matches=0;
document.getElementById("status").innerText="";

const termsDiv=document.getElementById("terms");
const defsDiv=document.getElementById("definitions");

termsDiv.innerHTML="";
defsDiv.innerHTML="";

const shuffledTerms=shuffle([...pairs]);
const shuffledDefs=shuffle([...pairs]);

shuffledTerms.forEach(p=>{

const card=document.createElement("div");
card.className="term";
card.draggable=true;
card.innerText=p.term;
card.dataset.match=p.term;

/* accessibility improvements */
card.setAttribute("tabindex","0");
card.setAttribute("role","button");
card.setAttribute("aria-label","Vocabulary term: " + p.term + ". Drag to match its definition.");

card.addEventListener("dragstart",()=>{
dragged=card;
});

termsDiv.appendChild(card);

});

shuffledDefs.forEach(p=>{

const drop=document.createElement("div");
drop.className="definition";
drop.innerText=p.definition;
drop.dataset.match=p.term;

/* accessibility improvements */
drop.setAttribute("tabindex","0");
drop.setAttribute("aria-label","Definition: " + p.definition);

drop.addEventListener("dragover",function(e){
e.preventDefault();
this.classList.add("hover");
});

drop.addEventListener("dragleave",function(){
this.classList.remove("hover");
});

drop.addEventListener("drop",function(e){

e.preventDefault();
this.classList.remove("hover");

if(!dragged) return;

if(dragged.dataset.match===this.dataset.match){

this.classList.add("correct");

/* snap into place */
this.innerHTML="";
this.appendChild(dragged);

dragged.style.cursor="default";
dragged.draggable=false;

matches++;

if(matches===pairs.length){
document.getElementById("status").innerText="Nice work! All matches complete.";
}

}else{

/* bounce feedback */
this.classList.add("shake");

setTimeout(()=>{
this.classList.remove("shake");
},350);

}

});

defsDiv.appendChild(drop);

});

}

startGame();

</script>

</body>
</html>
